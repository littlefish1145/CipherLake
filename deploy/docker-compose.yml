version: "3.8"

# Production deployment docker-compose for CipherLake Object Storage
# Usage: docker compose -f deploy/docker-compose.yml up -d

x-cipherlake-common: &cipherlake-common
  image: cipherlake:latest
  restart: unless-stopped
  networks:
    - cipherlake-net

services:
  cipherlake:
    <<: *cipherlake-common
    ports:
      - "${CIPHERLAKE_PORT:-9000}:9000"
      - "${CIPHERLAKE_ADMIN_PORT:-9001}:9001"
      - "${CIPHERLAKE_METRICS_PORT:-9091}:9091"
    environment:
      CIPHERLAKE_CONFIG: /etc/cipherlake/config.yaml
      CIPHERLAKE_GATEWAY_ADDRESS: ":9000"
      CIPHERLAKE_GATEWAY_ADMIN_ADDRESS: ":9001"
      CIPHERLAKE_GATEWAY_ACCESS_KEY: "${CIPHERLAKE_ACCESS_KEY:-cipherlake}"
      CIPHERLAKE_GATEWAY_SECRET_KEY: "${CIPHERLAKE_SECRET_KEY:-cipherlake-secret}"
      CIPHERLAKE_STORAGE_BACKEND: "local"
      CIPHERLAKE_STORAGE_LOCAL_DATA_DIR: "/var/lib/cipherlake/data"
      CIPHERLAKE_METADATA_BACKEND: "boltdb"
      CIPHERLAKE_METADATA_PATH: "/var/lib/cipherlake/metadata/metadata.db"
      CIPHERLAKE_OBSERVABILITY_LOGGING_LEVEL: "${CIPHERLAKE_LOG_LEVEL:-info}"
      CIPHERLAKE_OBSERVABILITY_METRICS_ENABLED: "true"
      CIPHERLAKE_SERVICES_ENCRYPT_ADDRESS: "encrypt-service:50051"
      CIPHERLAKE_SERVICES_DECRYPT_ADDRESS: "decrypt-service:50052"
      CIPHERLAKE_SERVICES_KEYGEN_ADDRESS: "keygen-service:50053"
      CIPHERLAKE_SERVICES_KEYSTORE_ADDRESS: "keystore-service:50054"
      CIPHERLAKE_SERVICES_KEYUNWRAP_ADDRESS: "keyunwrap-service:50055"
      CIPHERLAKE_SERVICES_TOKEN_ADDRESS: "token-service:50056"
      CIPHERLAKE_SERVICES_STS_ADDRESS: "sts-service:50057"
    volumes:
      - cipherlake-data:/var/lib/cipherlake/data
      - cipherlake-metadata:/var/lib/cipherlake/metadata
      - ./config.yaml:/etc/cipherlake/config.yaml:ro
    depends_on:
      encrypt-service:
        condition: service_healthy
      decrypt-service:
        condition: service_healthy
      keygen-service:
        condition: service_healthy
      keystore-service:
        condition: service_healthy
      keyunwrap-service:
        condition: service_healthy
      token-service:
        condition: service_healthy
      sts-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  encrypt-service:
    <<: *cipherlake-common
    command: ["/usr/local/bin/encrypt-service"]
    environment:
      CIPHERLAKE_SERVICE_ADDRESS: ":50051"
      CIPHERLAKE_OBSERVABILITY_LOGGING_LEVEL: "${CIPHERLAKE_LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  decrypt-service:
    <<: *cipherlake-common
    command: ["/usr/local/bin/decrypt-service"]
    environment:
      CIPHERLAKE_SERVICE_ADDRESS: ":50052"
      CIPHERLAKE_OBSERVABILITY_LOGGING_LEVEL: "${CIPHERLAKE_LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50052"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  keygen-service:
    <<: *cipherlake-common
    command: ["/usr/local/bin/keygen-service"]
    environment:
      CIPHERLAKE_SERVICE_ADDRESS: ":50053"
      CIPHERLAKE_OBSERVABILITY_LOGGING_LEVEL: "${CIPHERLAKE_LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50053"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  keystore-service:
    <<: *cipherlake-common
    command: ["/usr/local/bin/keystore-service"]
    environment:
      CIPHERLAKE_SERVICE_ADDRESS: ":50054"
      CIPHERLAKE_KEYSTORE_PATH: "/var/lib/cipherlake/keystore/keystore.db"
      CIPHERLAKE_OBSERVABILITY_LOGGING_LEVEL: "${CIPHERLAKE_LOG_LEVEL:-info}"
    volumes:
      - cipherlake-keystore:/var/lib/cipherlake/keystore
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50054"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  keyunwrap-service:
    <<: *cipherlake-common
    command: ["/usr/local/bin/keyunwrap-service"]
    environment:
      CIPHERLAKE_SERVICE_ADDRESS: ":50055"
      CIPHERLAKE_OBSERVABILITY_LOGGING_LEVEL: "${CIPHERLAKE_LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50055"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  token-service:
    <<: *cipherlake-common
    command: ["/usr/local/bin/token-service"]
    environment:
      CIPHERLAKE_SERVICE_ADDRESS: ":50056"
      CIPHERLAKE_OBSERVABILITY_LOGGING_LEVEL: "${CIPHERLAKE_LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50056"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  sts-service:
    <<: *cipherlake-common
    command: ["/usr/local/bin/sts-service"]
    environment:
      CIPHERLAKE_SERVICE_ADDRESS: ":50057"
      CIPHERLAKE_OBSERVABILITY_LOGGING_LEVEL: "${CIPHERLAKE_LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50057"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  plugin-loader-service:
    <<: *cipherlake-common
    command: ["/usr/local/bin/plugin-loader-service", "-config", "/etc/cipherlake/config.yaml"]
    ports:
      - "${PLUGIN_LOADER_PORT:-50060}:50060"
    environment:
      CIPHERLAKE_OBSERVABILITY_LOGGING_LEVEL: "${CIPHERLAKE_LOG_LEVEL:-info}"
      # Plugin loader uses its own Raft instance (separate data dir) so its
      # state machine evolution does not affect the main cipherlake FSM.
      # See .trae/specs/plugin-system/spec.txt §2.2.
    volumes:
      - cipherlake-plugin-loader:/var/lib/cipherlake/plugin-loader
      - ./config.yaml:/etc/cipherlake/config.yaml:ro
    depends_on:
      encrypt-service:
        condition: service_healthy
      decrypt-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:50060/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  cipherlake-data:
    driver: local
  cipherlake-metadata:
    driver: local
  cipherlake-keystore:
    driver: local
  cipherlake-plugin-loader:
    driver: local

networks:
  cipherlake-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

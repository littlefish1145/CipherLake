version: "3.8"

services:
  cipherlake:
    image: cipherlake:latest
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      CIPHERLAKE_GATEWAY_ADDRESS: ":9000"
      CIPHERLAKE_GATEWAY_ADMIN_ADDRESS: ":9001"
      CIPHERLAKE_GATEWAY_ACCESS_KEY: "cipherlake"
      CIPHERLAKE_GATEWAY_SECRET_KEY: "cipherlake-secret"
      CIPHERLAKE_STORAGE_BACKEND: "local"
      CIPHERLAKE_STORAGE_LOCAL_DATA_DIR: "/var/lib/cipherlake/data"
      CIPHERLAKE_METADATA_BACKEND: "boltdb"
      CIPHERLAKE_METADATA_PATH: "/var/lib/cipherlake/metadata.db"
      CIPHERLAKE_OBSERVABILITY_LOGGING_LEVEL: "info"
      CIPHERLAKE_SERVICES_ENCRYPT_ADDRESS: "encrypt-service:50051"
      CIPHERLAKE_SERVICES_DECRYPT_ADDRESS: "decrypt-service:50052"
      CIPHERLAKE_SERVICES_KEYGEN_ADDRESS: "keygen-service:50053"
      CIPHERLAKE_SERVICES_KEYSTORE_ADDRESS: "keystore-service:50054"
      CIPHERLAKE_SERVICES_KEYUNWRAP_ADDRESS: "keyunwrap-service:50055"
      CIPHERLAKE_SERVICES_TOKEN_ADDRESS: "token-service:50056"
      CIPHERLAKE_SERVICES_STS_ADDRESS: "sts-service:50057"
    volumes:
      - cipherlake-data:/var/lib/cipherlake
    depends_on:
      encrypt-service:
        condition: service_healthy
      decrypt-service:
        condition: service_healthy
      keygen-service:
        condition: service_healthy
      keystore-service:
        condition: service_healthy
      keyunwrap-service:
        condition: service_healthy
      token-service:
        condition: service_healthy
      sts-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cipherlake-net

  encrypt-service:
    image: cipherlake:latest
    command: ["/usr/local/bin/encrypt-service"]
    environment:
      CIPHERLAKE_SERVICE_ADDRESS: ":50051"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - cipherlake-net

  decrypt-service:
    image: cipherlake:latest
    command: ["/usr/local/bin/decrypt-service"]
    environment:
      CIPHERLAKE_SERVICE_ADDRESS: ":50052"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50052"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - cipherlake-net

  keygen-service:
    image: cipherlake:latest
    command: ["/usr/local/bin/keygen-service"]
    environment:
      CIPHERLAKE_SERVICE_ADDRESS: ":50053"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50053"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - cipherlake-net

  keystore-service:
    image: cipherlake:latest
    command: ["/usr/local/bin/keystore-service"]
    environment:
      CIPHERLAKE_SERVICE_ADDRESS: ":50054"
      CIPHERLAKE_KEYSTORE_PATH: "/var/lib/cipherlake/keystore.db"
    volumes:
      - cipherlake-keystore:/var/lib/cipherlake
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50054"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - cipherlake-net

  keyunwrap-service:
    image: cipherlake:latest
    command: ["/usr/local/bin/keyunwrap-service"]
    environment:
      CIPHERLAKE_SERVICE_ADDRESS: ":50055"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50055"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - cipherlake-net

  token-service:
    image: cipherlake:latest
    command: ["/usr/local/bin/token-service"]
    environment:
      CIPHERLAKE_SERVICE_ADDRESS: ":50056"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50056"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - cipherlake-net

  sts-service:
    image: cipherlake:latest
    command: ["/usr/local/bin/sts-service"]
    environment:
      CIPHERLAKE_SERVICE_ADDRESS: ":50057"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50057"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - cipherlake-net

volumes:
  cipherlake-data:
  cipherlake-keystore:

networks:
  cipherlake-net:
    driver: bridge
